<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#10294b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6ee7ff"/></marker>
  </defs>
  <rect width="1400" height="760" rx="32" fill="url(#bg)"/>
  <text x="700" y="70" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">Adaptive Pedestrian Dead Reckoning Architecture</text>
  <text x="700" y="108" text-anchor="middle" fill="#b9c9df" font-family="Arial,Helvetica,sans-serif" font-size="19">Smartphone IMU → signal processing → movement awareness → adaptive positioning</text>

  <g filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif">
    <rect x="70" y="180" width="230" height="150" rx="24" fill="#163458" stroke="#59c7ff" stroke-width="2"/>
    <text x="185" y="218" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Smartphone IMU</text>
    <text x="185" y="260" text-anchor="middle" fill="#d6e8f7" font-size="18">Accelerometer</text>
    <text x="185" y="289" text-anchor="middle" fill="#d6e8f7" font-size="18">Gyroscope</text>
    <text x="185" y="318" text-anchor="middle" fill="#d6e8f7" font-size="18">Magnetometer</text>

    <rect x="375" y="180" width="230" height="150" rx="24" fill="#1d3d52" stroke="#79e0c7" stroke-width="2"/>
    <text x="490" y="218" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Preprocessing</text>
    <text x="490" y="260" text-anchor="middle" fill="#d9f6ee" font-size="18">Low-pass filtering</text>
    <text x="490" y="289" text-anchor="middle" fill="#d9f6ee" font-size="18">Magnitude features</text>
    <text x="490" y="318" text-anchor="middle" fill="#d9f6ee" font-size="18">Noise reduction</text>

    <rect x="680" y="150" width="250" height="140" rx="24" fill="#3a2d62" stroke="#b69cff" stroke-width="2"/>
    <text x="805" y="192" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Movement Recognition</text>
    <text x="805" y="232" text-anchor="middle" fill="#eee8ff" font-size="18">Window features</text>
    <text x="805" y="261" text-anchor="middle" fill="#eee8ff" font-size="18">Random Forest baseline</text>

    <rect x="680" y="345" width="250" height="140" rx="24" fill="#3b3048" stroke="#e9a9ff" stroke-width="2"/>
    <text x="805" y="387" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Step Detection</text>
    <text x="805" y="427" text-anchor="middle" fill="#f4e5fb" font-size="18">Acceleration magnitude</text>
    <text x="805" y="456" text-anchor="middle" fill="#f4e5fb" font-size="18">Peak detection</text>

    <rect x="1010" y="150" width="300" height="140" rx="24" fill="#473724" stroke="#ffc96d" stroke-width="2"/>
    <text x="1160" y="192" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Adaptive Parameters</text>
    <text x="1160" y="232" text-anchor="middle" fill="#fff0d1" font-size="18">Normal • Fast • Stairs • Incline</text>
    <text x="1160" y="261" text-anchor="middle" fill="#fff0d1" font-size="18">Mode-specific scaling</text>

    <rect x="1010" y="345" width="300" height="140" rx="24" fill="#21483e" stroke="#83efc7" stroke-width="2"/>
    <text x="1160" y="387" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Heading + Step Length</text>
    <text x="1160" y="427" text-anchor="middle" fill="#ddfff4" font-size="18">Gyro / magnetic fusion</text>
    <text x="1160" y="456" text-anchor="middle" fill="#ddfff4" font-size="18">Weinberg-style baseline</text>

    <rect x="520" y="570" width="360" height="120" rx="26" fill="#123d54" stroke="#6ee7ff" stroke-width="3"/>
    <text x="700" y="616" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Position Update</text>
    <text x="700" y="655" text-anchor="middle" fill="#d7f8ff" font-size="20">x,y trajectory + evaluation metrics</text>
  </g>

  <g stroke="#6ee7ff" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M300 255 H360"/>
    <path d="M605 225 H665"/>
    <path d="M605 285 C635 285 645 415 665 415"/>
    <path d="M930 220 H995"/>
    <path d="M930 415 H995"/>
    <path d="M1160 290 V330"/>
    <path d="M805 485 C805 525 760 535 735 560"/>
    <path d="M1160 485 C1160 545 930 585 895 610"/>
  </g>

  <g font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9fc9e6">
    <text x="330" y="242">raw IMU</text>
    <text x="620" y="210">features</text>
    <text x="945" y="205">mode</text>
    <text x="945" y="401">step event</text>
  </g>
</svg>